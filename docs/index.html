<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>花朝之約 · Mabinogi Lookup</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <header class="top">
    <h1>花朝之約 · Mabinogi Lookup</h1>
    <div class="sub" id="sub">載入中…</div>
    <div class="seg" id="metrics" role="group" aria-label="指標"></div>
    <div class="stats" id="stats"></div>
  </header>

  <section aria-labelledby="hRoster">
    <div class="sechead">
      <h2 id="hRoster">綜合總覽</h2>
      <input id="q" type="search" placeholder="搜尋成員或職業" autocomplete="off" aria-label="搜尋成員">
    </div>
    <div class="card"><table id="roster"></table></div>
  </section>

  <section aria-labelledby="hChart">
    <div class="sechead">
      <h2 id="hChart">綜合成長曲線</h2>
      <div class="tools">
        <span class="seg small" id="modes" role="group" aria-label="曲線模式"></span>
        <span class="seg small" id="ranges" role="group" aria-label="曲線範圍"></span>
      </div>
    </div>
    <div class="card pad"><div id="chart"></div></div>
  </section>

  <section aria-labelledby="hClass">
    <div class="sechead"><h2 id="hClass">職業統計</h2></div>
    <div class="stats" id="fun"></div>
    <div class="card peoplegrid" id="classList" role="group" aria-label="各職業人數"></div>
  </section>

  <footer>
    <p><strong>花朝之約 · Mabinogi Mobile Lookup</strong></p>
    <p id="footUpdated"></p>
    <p>資料來源：瑪奇 Mobile 台灣官方。非官方工具，與 Nexon || Devcat 無關。</p>
    <p>Made by community with ❤️ · No rights reserved</p>
  </footer>
</main>
<script src="app.js"></script>
</body>
</html>
